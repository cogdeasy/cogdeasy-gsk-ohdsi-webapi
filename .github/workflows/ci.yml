name: GSK CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'release/**']

permissions:
  contents: read

env:
  MAVEN_PROFILE: webapi-postgresql
  # Maven 3.10.0 rejects the miredot-plugin 2.4.0 POM (systemPath ${toolsjar}); pin 3.9.x.
  MAVEN_VERSION: 3.9.16
  MAVEN_SHA512: 831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: maven
      - name: Install pinned Maven
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maven.tar.gz" "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          echo "${MAVEN_SHA512}  $RUNNER_TEMP/maven.tar.gz" | sha512sum -c -
          tar xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin/mvn" -v
      - name: Package WAR
        run: mvn -B -DskipUnitTests -DskipITtests -P${{ env.MAVEN_PROFILE }} package
      - uses: actions/upload-artifact@v4
        with:
          name: webapi-war
          path: target/WebAPI.war
          retention-days: 7

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: maven
      - name: Install pinned Maven
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maven.tar.gz" "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          echo "${MAVEN_SHA512}  $RUNNER_TEMP/maven.tar.gz" | sha512sum -c -
          tar xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin/mvn" -v
      - name: Unit and integration tests with coverage
        run: mvn -B -P${{ env.MAVEN_PROFILE }} test
      - name: Test and coverage summary
        if: always()
        run: python3 dev/ci/summary.py >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/*.xml
            target/failsafe-reports/*.xml
            target/site/jacoco/
          retention-days: 14

  scan:
    name: scan
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: webapi-war
          path: scan-target
      - name: Trivy dependency scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: scan-target
          scanners: vuln
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: '0'
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy-war
      - name: Trivy summary
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: scan-target
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH,MEDIUM,LOW
          output: trivy.txt
          exit-code: '0'
          skip-setup-trivy: true
      - name: Publish scan summary
        run: |
          {
            echo "## Trivy findings in WebAPI.war"
            echo
            echo '```'
            grep -E '^(Total|WebAPI.war|scan-target)' trivy.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
